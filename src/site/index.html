<!doctype html>
<html lang="cy">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cwrs dwyieithog</title>
  <link rel="stylesheet" href="site.css">
  <style>
    main { max-width: 46rem; margin: 0 auto; padding: 4rem 1.5rem 5rem; }
    h1 { font: 400 clamp(2.25rem, 5vw, 3.25rem)/1.1 var(--serif); margin: 0 0 1.25rem; }
    .lede { font-size: 1.1875rem; margin: 0 0 1rem; }
    .parts { list-style: none; counter-reset: part; padding: 0; margin: 3.5rem 0 0; }
    .parts > li { counter-increment: part; display: grid; grid-template-columns: 3rem 1fr; padding: 2rem 0; border-top: 1px solid var(--line); }
    .parts > li::before { content: counter(part); font: 400 2rem/1 var(--serif); color: var(--accent); }
    .parts h2 { font: 400 1.625rem/1.25 var(--serif); margin: 0 0 .5rem; }
    .parts p { margin: 0 0 1rem; }
    .files { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid var(--line); }
    .files h2 { font: 600 .8125rem/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 1rem; }
    .files ul { list-style: none; margin: 0; padding: 0; }
    .files li { margin-bottom: .5rem; }
    .how { margin-top: 3rem; }
    .how h2 { font: 400 1.375rem/1.3 var(--serif); margin: 0 0 .75rem; }
    @media (max-width: 600px) {
      main { padding: 2.5rem 1rem 4rem; }
      .parts > li { grid-template-columns: 2.25rem 1fr; }
    }
  </style>
</head>
<body>
  <header class="bar">
    <span class="home" data-cy="Arddangosiad" data-en="Demonstration"></span>
    <button type="button" class="lang" id="ui-lang"></button>
  </header>
  <main>
    <span hidden data-cy-title="Cwrs dwyieithog · arddangosiad" data-en-title="Bilingual course · demonstration"></span>
    <h1 data-cy="Un cwrs, dwy iaith, un pecyn SCORM" data-en="One course, two languages, one SCORM package"></h1>
    <p class="lede" data-cy="Cwrs i Moodle gyda botwm sy'n newid rhwng Cymraeg a Saesneg ar yr un dudalen. Mae'r cynnwys yn dod o daenlen, felly does dim angen Storyline na Rise." data-en="A course for Moodle with a button that switches between Welsh and English on the same page. The content comes from a spreadsheet, so there is no need for Storyline or Rise."></p>
    <p class="note" data-cy="Testun demo yw cynnwys y cwrs, nid deunydd dysgu go iawn." data-en="The course content is demo text, not real learning material."></p>

    <ol class="parts">
      <li>
        <div>
          <h2 data-cy="Y cwrs" data-en="The course"></h2>
          <p data-cy="Ewch drwy'r cwrs fel dysgwr. Newidiwch iaith unrhyw bryd: rydych chi'n aros ar yr un dudalen, ac mae'ch atebion yn aros hefyd." data-en="Go through the course as a learner. Switch language at any time: you stay on the same page, and so do your answers."></p>
          <a class="button" href="cwrs/" data-cy="Agor y cwrs" data-en="Open the course"></a>
        </div>
      </li>
      <li>
        <div>
          <h2 data-cy="Beth mae Moodle yn ei weld" data-en="What Moodle sees"></h2>
          <p data-cy="Y cwrs ar y chwith. Ar y dde, beth mae'r cwrs yn ei anfon i Moodle: tudalen, iaith, sgôr, a phasio neu beidio. Caewch y cwrs a'i ailagor i weld y dysgwr yn ailgychwyn lle gadawodd." data-en="The course on the left. On the right, what the course sends to Moodle: page, language, score, and pass or fail. Close the course and reopen it to see the learner resume where they left off."></p>
          <a class="button" href="moodle.html" data-cy="Agor golwg Moodle" data-en="Open the Moodle view"></a>
        </div>
      </li>
      <li>
        <div>
          <h2 data-cy="Y golygydd" data-en="The editor"></h2>
          <p data-cy="Newidiwch destun yn Gymraeg neu'n Saesneg a gweld y cwrs yn newid wrth ei ochr. Os oes cyfieithiad ar goll, mae'r golygydd yn dweud ble. Pan mae'n barod, lawrlwythwch y pecyn SCORM." data-en="Change text in Welsh or English and watch the course change beside it. If a translation is missing, the editor says where. When it is ready, download the SCORM package."></p>
          <a class="button" href="golygydd.html" data-cy="Agor y golygydd" data-en="Open the editor"></a>
        </div>
      </li>
    </ol>

    <section class="how">
      <h2 data-cy="Sut mae'n gweithio" data-en="How it works"></h2>
      <p data-cy="Mae pob darn o destun yn bodoli yn y ddwy iaith ochr yn ochr. Mae'r adeiladwr yn gwrthod cwrs os oes testun ar goll mewn un iaith, felly does dim modd cyhoeddi cwrs hanner Saesneg. Mae'r un ffeiliau'n gweithio fel gwefan ac fel pecyn SCORM 1.2 i Moodle." data-en="Every piece of text exists in both languages side by side. The builder refuses a course with text missing in one language, so a half-English course cannot be published. The same files work as a website and as a SCORM 1.2 package for Moodle."></p>
    </section>

    <section class="files">
      <h2 data-cy="Ffeiliau" data-en="Files"></h2>
      <ul>
        <li><a href="plymio-demo-scorm12.zip" data-cy="Pecyn SCORM 1.2 i Moodle (zip)" data-en="SCORM 1.2 package for Moodle (zip)"></a></li>
        <li><a href="plymio-demo.csv" data-cy="Taenlen y cwrs (CSV, yn agor yn Excel)" data-en="The course spreadsheet (CSV, opens in Excel)"></a></li>
      </ul>
    </section>
  </main>
  <script type="module" src="ui.js"></script>
</body>
</html>
